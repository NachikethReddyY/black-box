name: Reviewer

on:
  push:
    paths:
      - 'reviewer/**'
      - '.github/workflows/reviewer.yml'
  pull_request:
    paths:
      - 'reviewer/**'
      - '.github/workflows/reviewer.yml'

permissions:
  contents: read

jobs:
  reviewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reviewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
