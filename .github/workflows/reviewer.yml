name: Reviewer

on:
  push:
    paths:
      - 'reviewer/**'
      - '.github/workflows/reviewer.yml'
      - '.github/workflows/ai-reviewer.yml'
  # PR code is tested on an ephemeral GitHub-hosted runner without reviewer
  # credentials. Never execute PR-controlled code in a target-workflow context.
  pull_request:
    paths:
      - 'reviewer/**'
      - '.github/workflows/reviewer.yml'
      - '.github/workflows/ai-reviewer.yml'

permissions: {}

jobs:
  reviewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reviewer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reviewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
